name: Build LiquidGlassCC18 roothide deb

# 编译跑在 GitHub 提供的 macOS 云主机上（自带 Xcode）。
# 与旧版的区别：构建输出会完整保存到 build.log，
# 失败时把关键错误行写成 annotation 并上传日志，方便直接定位编译错误。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  # 用于自动创建 Release，让你能直接下载 .deb
  contents: write

jobs:
  build:
    # 使用当前受支持的 arm64 macOS runner 标签
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        env:
          # install-sdk 走 api.github.com；带上 token 可避免匿名限流导致 SDK 下载失败
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export THEOS="$HOME/theos"
          echo "==> Xcode: $(xcode-select -p)"
          echo "==> clang: $(clang --version | head -n 1)"
          ./build.sh 2>&1 | tee build.log

      # 失败时把真正的编译/打包错误暴露出来，而不是只有一句 exit code 2
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then echo "no build.log was produced"; exit 0; fi
          echo "::group::Last 100 lines of build log"
          tail -n 100 build.log
          echo "::endgroup::"
          key=$(grep -E -i 'error:|fatal:|Error [0-9]|No rule to make|Undefined symbols|ld: |clang: |not found|No such file|Permission denied|missing a filter|ldid|dpkg-deb|make.*Error' build.log | tail -n 25 | tr '\n' '~' | tr -d '\r' | sed 's/%/%25/g; s/::/:/g' | cut -c1-6000)
          if [ -n "$key" ]; then echo "::error title=Build failed::$key"; fi
          {
            echo "### 构建失败 · 最后 60 行日志"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成功失败都保留完整日志（公开仓库可直接下载）
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassCC18-roothide
          path: packages/*.deb
          if-no-files-found: error

      # 构建成功后直接发布成 Release，网页上点一下就能下 .deb
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LiquidGlassCC18 build ${{ github.run_number }}
          files: packages/*.deb
          body: |
            iOS 16 / roothide (arm64e) 自动构建。
            需要已安装 ControlCenter18。
            安装：dpkg -i <文件>.deb && killall -9 SpringBoard
